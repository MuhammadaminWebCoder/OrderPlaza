<style>
/* loading screen — like the 3D Kadastr site: on night the gold sign turns once and shrinks, "Order Plaza" slides
   out from behind it. Then the site opens through clouds: the screen fills with cloud, the clouds part to the sides,
   up and down (the middle one passing the camera) and the building comes up from behind them.
   Cloud sprites: tools/build_clouds.py */
html.is-preloading,html.is-preloading body{overflow:hidden}
.preloader{position:fixed;inset:0;z-index:300;display:grid;place-items:center;perspective:900px}
html:not(.is-preloading) .preloader:not(.is-open){display:none}
.pl-half{position:absolute;left:0;right:0;height:50.5%;background:#05080E;transition:transform 1s cubic-bezier(.7,0,.2,1)}
.pl-top{top:0}.pl-bot{bottom:0}
.pl-brand{position:relative;display:flex;align-items:center;transition:opacity .45s ease,transform .9s cubic-bezier(.7,0,.2,1),filter .6s ease}
.pl-logo{display:block;width:clamp(150px,17vw,230px);height:clamp(150px,17vw,230px);flex:none;transform-style:preserve-3d;
  animation:plFlip 1.05s cubic-bezier(.45,0,.2,1) .15s both,plShrink .75s cubic-bezier(.7,0,.2,1) 1.25s forwards}
.pl-logo img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes plFlip{from{opacity:0;transform:rotateY(0) scale(.7)}25%{opacity:1}to{opacity:1;transform:rotateY(360deg) scale(1)}}
@keyframes plShrink{to{width:clamp(90px,9vw,130px);height:clamp(90px,9vw,130px)}}
.pl-name{display:block;max-width:0;overflow:hidden;white-space:nowrap;animation:plOpen .85s cubic-bezier(.7,0,.2,1) 1.3s forwards}
.pl-name span{display:inline-block;padding-left:clamp(14px,2vw,28px);font:600 clamp(44px,7vw,104px)/1 "Space Grotesk","Manrope",system-ui,sans-serif;letter-spacing:-.035em;color:#fff;
  transform:translateX(-100%);animation:plSlide .85s cubic-bezier(.2,.8,.2,1) 1.38s forwards}
@keyframes plOpen{to{max-width:900px}}
@keyframes plSlide{to{transform:none}}
.pl-progress{position:absolute;left:50%;bottom:clamp(48px,12vh,110px);width:min(320px,60vw);height:2px;transform:translateX(-50%);border-radius:2px;background:rgba(236,239,243,.1);overflow:hidden;transition:opacity .4s ease}
.pl-progress i{display:block;height:100%;background:#D2A954;transform:scaleX(0);transform-origin:0 50%;transition:transform .35s ease-out}
.preloader.is-open{pointer-events:none}
.preloader.is-open .pl-half{opacity:0;transition:opacity .01s linear .5s}
.preloader.is-open .pl-brand{opacity:0;transform:scale(1.18);filter:blur(6px)}
.preloader.is-open .pl-progress{opacity:0}
/* the clouds: a pale haze and big cumulus over the whole screen, each leaving its own way */
.pl-sky{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none}
.pl-haze{position:absolute;inset:0;background:#EEF3F8}
.pl-c{position:absolute;height:auto;max-width:none;will-change:transform,opacity,filter;transform:scale(var(--f,1),1)}
.preloader.is-open .pl-sky{animation:skyIn .5s ease-out both}
.preloader.is-open .pl-haze{animation:hazeOut 1s ease-in-out .55s both}
.preloader.is-open .pl-c{animation:cloudOut 1.9s cubic-bezier(.55,.05,.3,1) .45s both}
@keyframes skyIn{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:none}}
@keyframes hazeOut{to{opacity:0}}
@keyframes cloudOut{
  from{transform:translate(0,0) scale(var(--f,1),1);opacity:1;filter:blur(0)}
  70%{opacity:1}
  to{transform:translate(var(--tx),var(--ty)) scale(calc(var(--s) * var(--f,1)),var(--s));opacity:0;filter:blur(10px)}}
@media (max-width:560px){
  .pl-logo{width:120px;height:120px}
  @keyframes plShrink{to{width:58px;height:58px}}
  .pl-name span{font-size:34px;padding-left:10px}
}
</style>

<!-- loading screen (like the 3D Kadastr site), plain HTML so it shows before the app has loaded:
     the sign turns once, the name slides out, the screen opens once the fonts and the hero picture are in -->
<div class="preloader" id="preloader" role="status" aria-label="Order Plaza yuklanmoqda">
  <div class="pl-half pl-top"></div><div class="pl-half pl-bot"></div>
  <div class="pl-sky" aria-hidden="true">
    <div class="pl-haze"></div>
    <img class="pl-c" src="assets/img/cloud-3.webp" alt="" style="left:-24vw;top:-14vh;width:100vw;--tx:-62vw;--ty:-16vh;--s:1.5">
    <img class="pl-c" src="assets/img/cloud-1.webp" alt="" style="right:-26vw;top:-10vh;width:104vw;--tx:64vw;--ty:-14vh;--s:1.5">
    <img class="pl-c" src="assets/img/cloud-2.webp" alt="" style="left:-14vw;top:34vh;width:90vw;--tx:-72vw;--ty:8vh;--s:1.6">
    <img class="pl-c" src="assets/img/cloud-1.webp" alt="" style="right:-18vw;top:30vh;width:96vw;--tx:72vw;--ty:6vh;--s:1.6;--f:-1">
    <img class="pl-c" src="assets/img/cloud-2.webp" alt="" style="left:-6vw;top:62vh;width:100vw;--tx:-26vw;--ty:42vh;--s:1.7;--f:-1">
    <img class="pl-c" src="assets/img/cloud-3.webp" alt="" style="right:-10vw;top:60vh;width:92vw;--tx:28vw;--ty:42vh;--s:1.7">
    <img class="pl-c" src="assets/img/cloud-1.webp" alt="" style="left:20vw;top:-22vh;width:76vw;--tx:0vw;--ty:-46vh;--s:1.5;--f:-1">
    <img class="pl-c" src="assets/img/cloud-3.webp" alt="" style="left:6vw;top:12vh;width:92vw;--tx:0vw;--ty:4vh;--s:2.8">
  </div>
  <div class="pl-brand">
    <span class="pl-logo"><img src="assets/img/order-plaza-mark.webp" alt="" width="256" height="256"></span>
    <span class="pl-name" aria-hidden="true"><span>Order Plaza</span></span>
  </div>
  <div class="pl-progress" aria-hidden="true"><i id="plBar"></i></div>
</div>
<script>
/* at least 2.3 s, at most 7 s; the app reports the hero picture with a 'hero:ready' event */
(function () {
  var html = document.documentElement, pl = document.getElementById('preloader'), bar = document.getElementById('plBar');
  if (!html.classList.contains('is-preloading')) { pl.remove(); return; }
  var t0 = performance.now(), done = false, got = 0, need = 2;
  function step() { got++; bar.style.transform = 'scaleX(' + Math.min(1, .25 + got / need * .75) + ')'; if (got >= need) open(); }
  function open() {
    if (done) return; done = true;
    setTimeout(function () {
      bar.style.transform = 'scaleX(1)';
      pl.classList.add('is-open');
      // the page wakes up under the clouds (the hero picture settles, its lines rise) as they part
      setTimeout(function () { html.classList.remove('is-preloading'); window.__preloaderOpen = true; dispatchEvent(new Event('preloader:open')); }, 500);
      setTimeout(function () { pl.remove(); }, 2500);
    }, Math.max(0, 2300 - (performance.now() - t0)));
  }
  requestAnimationFrame(function () { bar.style.transform = 'scaleX(.25)'; });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(step, step);
  addEventListener('hero:ready', step, { once: true });
  setTimeout(open, 7000);
})();
</script>
